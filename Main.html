<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacity Connect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <!-- ==================== NAVBAR ==================== -->
<header class="navbar">
  <a href="#" class="brand">
    <img src="Images\online-education.gif" alt="Online Lesson Animated Icon" width="60" height="60">
    <span class="brand-name">
      <span class="brand-top">CAPACITY</span>
      <span class="brand-bottom">CONNECT</span>
    </span>
  </a>

  <nav class="nav-menu" id="navMenu">
    <div class="nav-buttons">
        <button class="login-nav" type="button">
          Explore Courses
          <span class="line line-top"></span>
          <span class="line line-right"></span>
          <span class="line line-bottom"></span>
          <span class="line line-left"></span>
        </button>
        <button class="signup-btn" type="button">Login / Sign Up</button>
    </div>
  </nav>

  <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<!-- ==================== HERO BANNER ==================== -->
  <section class="banner">
    <div class="banner-inner">
      <div class="banner-text">
        <h1 class="banner-title">
          <span class="title-dark">CAPACITY</span>
          <span class="title-teal">CONNECT</span>
        </h1>
        <p class="banner-desc">
          Empowering growth in<br>
          modern description and<br>
          achieving your goals with our platform.
        </p>
      </div>

      <div class="banner-art">
        <svg class="art-svg" viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <ellipse cx="300" cy="215" rx="215" ry="165" fill="#f0faf5"/>
          <ellipse cx="290" cy="362" rx="200" ry="20" fill="#e2f4ec"/>

          <!-- leaves left -->
          <path d="M120 350 C80 300 95 205 175 175 C165 265 160 325 120 350Z" fill="#8ed9b9"/>
          <path d="M175 175 C165 265 160 325 120 350" stroke="#5cc79c" stroke-width="3" fill="none"/>
          <path d="M92 352 C60 320 62 262 104 238 C104 292 110 332 92 352Z" fill="#bce7d3"/>

          <!-- leaves right -->
          <path d="M498 300 C528 258 516 200 466 180 C466 240 472 280 498 300Z" fill="#a9e2c9"/>
          <path d="M452 352 C494 336 510 296 494 262 C464 292 448 322 452 352Z" fill="#7fd3b0"/>

          <!-- desk -->
          <rect x="170" y="330" width="260" height="12" rx="6" fill="#cfe9e0"/>

          <!-- chair -->
          <rect x="210" y="200" width="180" height="140" rx="40" fill="#1aa87c"/>

          <!-- hoodie -->
          <path d="M220 344 L230 250 Q300 200 370 250 L380 344 Z" fill="#17a07a"/>
          <path d="M275 218 L300 258 L325 218 Z" fill="#0f8763"/>

          <!-- neck + head -->
          <path d="M280 186 h40 v32 q-20 14 -40 0 Z" fill="#e2a678"/>
          <circle cx="300" cy="156" r="46" fill="#f0bb8d"/>
          <path d="M256 154 Q262 100 302 100 Q344 100 344 152 Q336 124 302 128 Q270 130 256 154Z" fill="#2c2b33"/>
          <circle cx="282" cy="158" r="4.5" fill="#2c2b33"/>
          <circle cx="320" cy="158" r="4.5" fill="#2c2b33"/>
          <path d="M292 178 q9 7 18 0" stroke="#c98a5d" stroke-width="3" fill="none" stroke-linecap="round"/>

          <!-- arms -->
          <path d="M235 263 Q216 310 248 325" stroke="#17a07a" stroke-width="26" stroke-linecap="round" fill="none"/>
          <path d="M365 263 Q384 310 352 325" stroke="#17a07a" stroke-width="26" stroke-linecap="round" fill="none"/>
          <circle cx="252" cy="327" r="12" fill="#f0bb8d"/>
          <circle cx="348" cy="327" r="12" fill="#f0bb8d"/>

          <!-- laptop -->
          <path d="M242 330 L262 277 h76 l20 53 Z" fill="#2f5568"/>
          <path d="M252 325 L268 284 h64 l16 41 Z" fill="#7aa6bd"/>
          <rect x="228" y="330" width="144" height="12" rx="6" fill="#294657"/>

          <!-- plant pot -->
          <path d="M432 300 q-6 -58 22 -82" stroke="#4fc294" stroke-width="5" fill="none"/>
          <path d="M454 218 q26 6 26 34 q-26 4 -26 -34Z" fill="#1aa87c"/>
          <path d="M452 252 q-26 4 -28 32 q26 2 28 -32Z" fill="#5fcda3"/>

          <!-- floating icons -->
          <g class="float float-a">
            <rect x="150" y="40" width="70" height="70" rx="22" fill="#1aa87c"/>
            <path d="M167 72 L185 63 L203 72 L185 81 Z" fill="#fff"/>

          </g>
          <g class="float float-b">

            <rect x="486" y="176" width="8" height="15" rx="2" fill="#1aa87c"/>
            <rect x="497" y="168" width="8" height="23" rx="2" fill="#2f7fbf"/>
            <rect x="508" y="158" width="8" height="33" rx="2" fill="#123a4d"/>
          </g>

          <circle cx="232" cy="128" r="6" fill="#7fd3b0"/>
          <circle cx="392" cy="190" r="5" fill="#9fdcf0"/>
        </svg>
      </div>
    </div>
  </section>


    <script src="Scripts.js"></script>
</body>
</html>
