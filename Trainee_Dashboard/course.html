<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Learning - Capacity Connect</title>
  <link rel="stylesheet" href="css/trainee.css">
</head>
<body>
  <nav class="navbar">
    <a href="trainee-dashboard.html" class="brand-logo"><span class="capacity">Capacity</span><span class="connect">Connect</span></a>
    <ul class="nav-links">
      <li><a href="enrolled-courses.html" class="nav-link">Back to Enrolled Courses</a></li>
      <li><button id="nav-logout-btn" class="btn-logout">Logout</button></li>
    </ul>
  </nav>

  <main id="course-detail-page" class="container">
    <div class="page-header">
      <h1 id="course-title">Loading...</h1>
      <p id="course-code"></p>
    </div>

    <div style="background: var(--white); border-radius: var(--radius-md); padding: 20px; margin-bottom: 24px; border: 1px solid var(--gray-200);">
      <h3>Course Overview</h3>
      <p id="course-desc" style="font-size: 13.5px; color: var(--gray-600); margin: 8px 0 16px 0;"></p>
      
      <div class="progress-bar-wrap" style="width: 100%;">
        <div class="progress-labels">
          <span>Overall Course Progress</span>
          <span id="course-progress-text">0% Completed</span>
        </div>
        <div class="progress-track"><div id="course-progress-fill" class="progress-fill" style="width: 0%;"></div></div>
      </div>
    </div>

    <h2 class="section-title" style="margin-bottom: 16px;">Learning Modules</h2>
    <div id="modules-list"></div>
  </main>

  <footer class="footer">© 2026 Capacity Connect</footer>
  <script src="js/trainee-data.js"></script>
  <script src="js/trainee.js"></script>
  <script src="js/courses.js"></script>
</body>
</html>
