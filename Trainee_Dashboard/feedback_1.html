<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Feedback - Capacity Connect</title>
  <link rel="stylesheet" href="css/trainee.css">
</head>
<body>
  <nav class="navbar">
    <a href="trainee-dashboard.html" class="brand-logo"><span class="capacity">Capacity</span><span class="connect">Connect</span></a>
    <ul class="nav-links">
      <li><a href="trainee-dashboard.html" class="nav-link">Dashboard</a></li>
      <li><button id="nav-logout-btn" class="btn-logout">Logout</button></li>
    </ul>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1>Course Feedback</h1>
      <p>Submit your constructive feedback to help us improve learning experience.</p>
    </div>

    <div class="form-card">
      <form id="feedback-form">
        <div class="form-group">
          <label>Select Course & Trainer</label>
          <select id="fb-course" class="form-control" required></select>
        </div>

        <div class="form-group">
          <label>Overall Course Rating (1–5 Stars)</label>
          <select id="fb-rating" class="form-control" required>
            <option value="5">⭐⭐⭐⭐⭐ (5/5) Excellent</option>
            <option value="4">⭐⭐⭐⭐ (4/5) Very Good</option>
            <option value="3">⭐⭐⭐ (3/5) Average</option>
            <option value="2">⭐⭐ (2/2) Below Average</option>
            <option value="1">⭐ (1/5) Poor</option>
          </select>
        </div>

        <div class="form-group">
          <label>What did you like about this course?</label>
          <textarea id="fb-comments" class="form-control" rows="4" placeholder="Share your suggestions..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Feedback</button>
      </form>
    </div>
  </main>

  <footer class="footer">© 2026 Capacity Connect</footer>
  <script src="js/trainee-data.js"></script>
  <script src="js/trainee.js"></script>
  <script src="js/feedback.js"></script>
</body>
</html>
