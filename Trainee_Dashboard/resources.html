<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources - Capacity Connect</title>
  <link rel="stylesheet" href="css/trainee.css">
</head>
<body>
  <nav class="navbar">
    <a href="trainee-dashboard.html" class="brand-logo"><span class="capacity">Capacity</span><span class="connect">Connect</span></a>
    <ul class="nav-links">
      <li><a href="trainee-dashboard.html" class="nav-link">Dashboard</a></li>
      <li><button id="nav-logout-btn" class="btn-logout">Logout</button></li>
    </ul>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1>Resource Center</h1>
      <p>Access study materials, lecture slides, and reference files.</p>
    </div>

    <div class="filters-bar">
      <input type="text" id="res-search" class="filter-input" placeholder="Search resources...">
      <select id="res-type-filter" class="filter-select">
        <option value="">All Types</option>
        <option value="PDF">PDF</option>
        <option value="PPTX">PPTX</option>
        <option value="DOCX">DOCX</option>
      </select>
    </div>

    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th>Resource Title</th>
            <th>Course Info</th>
            <th>Trainer Name</th>
            <th>Type</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="resources-table-body"></tbody>
      </table>
    </div>
  </main>

  <footer class="footer">© 2026 Capacity Connect</footer>
  <script src="js/trainee-data.js"></script>
  <script src="js/trainee.js"></script>
  <script src="js/resources.js"></script>
</body>
</html>
